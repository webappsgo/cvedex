name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: gitea.event_name != 'schedule'
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    if: gitea.event_name != 'schedule'
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p /tmp/casapps
          COVDIR=$(mktemp -d /tmp/casapps/cvedex-XXXXXX)
          echo "COVDIR=$COVDIR" >> "$GITHUB_ENV"
          go test -cover -coverprofile="$COVDIR/coverage.out" ./...
      - name: Enforce coverage threshold
        run: |
          test -s "$COVDIR/coverage.out" || { echo "coverage profile missing"; exit 1; }
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%", "", $3); print $3}')
          [ -n "$PCT" ] || { echo "coverage total missing"; exit 1; }
          awk -v pct="$PCT" 'BEGIN { if (pct < 60) { printf "coverage %.1f%% < threshold 60%%\n", pct; exit 1 } }'

  build:
    if: gitea.event_name != 'schedule'
    needs: [lint, test]
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    env:
      CGO_ENABLED: "0"
      GOFLAGS: "-buildvcs=false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go build ./...

  vuln-scan:
    runs-on: docker
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: govulncheck ./...

  secret-scan:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select scan scope
        id: scope
        run: |
          ZERO=0000000000000000000000000000000000000000
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            echo "base=${{ gitea.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ gitea.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "results=verified,unknown" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "${{ gitea.event.before }}" != "$ZERO" ]; then
            echo "base=${{ gitea.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ gitea.event.after }}" >> "$GITHUB_OUTPUT"
            echo "results=verified,unknown" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=" >> "$GITHUB_OUTPUT"
            echo "results=verified" >> "$GITHUB_OUTPUT"
          fi
      - uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          base: ${{ steps.scope.outputs.base }}
          head: ${{ steps.scope.outputs.head }}
          extra_args: --results=${{ steps.scope.outputs.results }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-policy:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Enforce workflow security policy
        run: |
          set -eu
          if grep -R -n 'pull_request_target' .github/workflows .gitea/workflows .forgejo/workflows; then exit 1; fi
          if grep -R -nE '^ +uses: +[^@[:space:]]+@' .github/workflows .gitea/workflows .forgejo/workflows | grep -vE '@[0-9a-f]{40} +# v[0-9]'; then exit 1; fi
          if grep -R -nE '^ +uses: +[^@]+@[0-9a-f]{40}($| +#)' .github/workflows .gitea/workflows .forgejo/workflows | grep -v '# v[0-9]'; then exit 1; fi

  image-scan:
    runs-on: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag cvedex:ci --file docker/Dockerfile .
      - run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image --exit-code 1 --severity CRITICAL,HIGH cvedex:ci
