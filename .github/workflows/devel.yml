name: Devel Release

on:
  schedule:
    - cron: '0 3 * * *'
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devel-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml

  build:
    needs: preflight
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set build metadata
        run: |
          echo "VERSION=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "OFFICIAL_SITE=$(cat site.txt 2>/dev/null || true)" >> "$GITHUB_ENV"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
          go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src
          sha256sum "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" > "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devel-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cvedex-*
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move rolling devel tag to this commit
        run: |
          set -euo pipefail
          REMOTE_TAG=$(git ls-remote origin refs/tags/devel | awk 'NR == 1 {print $1}')
          if [ -n "$REMOTE_TAG" ]; then git push origin :refs/tags/devel; fi
          git tag -f devel HEAD
          git push origin refs/tags/devel
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: devel-*
          merge-multiple: true
          path: dist
      - name: Create release manifest
        run: (cd dist && sha256sum cvedex-* > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: devel
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
