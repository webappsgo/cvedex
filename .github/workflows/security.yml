name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (truffleHog)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scope scan
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "results=verified,unknown" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "base=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
            echo "results=verified,unknown" >> "$GITHUB_OUTPUT"
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "head=" >> "$GITHUB_OUTPUT"
            echo "results=verified" >> "$GITHUB_OUTPUT"
          fi

      - name: Run truffleHog
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          base: ${{ steps.scope.outputs.base }}
          head: ${{ steps.scope.outputs.head }}
          extra_args: --results=${{ steps.scope.outputs.results }} --exclude-paths=.github/trufflehog-exclude.txt

  workflow-sha-policy:
    name: Workflow SHA Pin Policy
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check all actions are pinned to SHA
        run: |
          set -e
          violations=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              if echo "$line" | grep -qE '^[[:space:]]+uses:[[:space:]]+[^@]+@[^[:space:]#]+([[:space:]]+#.*)?$'; then
                ref=$(echo "$line" | sed -E 's/.*uses:[[:space:]]+[^@]+@([^[:space:]#]+).*/\1/')
                if ! echo "$ref" | grep -qE '^[0-9a-f]{40}$'; then
                  echo "VIOLATION in $f: $line"
                  violations=$((violations + 1))
                fi
              fi
            done < "$f"
          done
          if [ "$violations" -gt 0 ]; then
            echo "ERROR: $violations action(s) not pinned to full commit SHA"
            exit 1
          fi
          echo "All actions are pinned to full commit SHA"
