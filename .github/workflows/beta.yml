name: Beta Release

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Create beta version
        id: version
        run: echo "version=$(date -u +%Y%m%d%H%M%S)-beta" >> "$GITHUB_OUTPUT"

  build:
    needs: [version, preflight]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set build metadata
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITHUB_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_EPOCH=$(date -u +%s)" >> "$GITHUB_ENV"
          echo "OFFICIAL_SITE=$(cat site.txt 2>/dev/null || true)" >> "$GITHUB_ENV"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          LDFLAGS="-s -w -X 'main.Version=${VERSION}' -X 'main.CommitID=${COMMIT_ID}' -X 'main.BuildEpoch=${BUILD_EPOCH}' -X 'main.OfficialSite=${OFFICIAL_SITE}'"
          go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" ./src
          sha256sum "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" > "cvedex-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cvedex-*
          retention-days: 30

  publish:
    needs: [build, version]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: beta-*
          merge-multiple: true
          path: dist
      - name: Set release version and checksums
        id: release
        run: |
          echo "tag=${{ needs.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          (cd dist && sha256sum cvedex-* > SHA256SUMS)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
