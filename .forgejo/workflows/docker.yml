name: Docker Images

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-${{ forgejo.ref }}-${{ forgejo.event_name }}
  cancel-in-progress: ${{ forgejo.ref == 'refs/heads/main' || forgejo.ref == 'refs/heads/master' || forgejo.ref == 'refs/heads/beta' }}

jobs:
  preflight:
    uses: ./.forgejo/workflows/ci.yml

  standard:
    if: forgejo.event_name != 'schedule'
    needs: preflight
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve package registry host
        id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.FORGEJO_TOKEN }}
      - name: Set image tags and build metadata
        id: meta
        run: |
          set -eu
          REGISTRY="${GITHUB_SERVER_URL#*://}"
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          SHA=$(git rev-parse --short=7 HEAD)
          TAGS="$IMAGE:$SHA"
          if [ "$GITHUB_REF" = refs/heads/beta ]; then TAGS="$TAGS\n$IMAGE:beta"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS\n$IMAGE:$VERSION\n$IMAGE:latest\n$IMAGE:$(date -u +%y%m)"
          fi
          printf 'tags<<EOF\n%b\nEOF\n' "$TAGS" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-devel}" >> "$GITHUB_OUTPUT"
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
            COMMIT_ID=${{ steps.meta.outputs.commit }}

  devel:
    if: forgejo.event_name == 'schedule' || forgejo.ref == 'refs/heads/main' || forgejo.ref == 'refs/heads/master'
    needs: preflight
    runs-on: docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve package registry host
        id: registry
        run: echo "host=${GITHUB_SERVER_URL#*://}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ forgejo.repository_owner }}
          password: ${{ secrets.FORGEJO_TOKEN }}
      - name: Set devel image metadata
        id: meta
        run: |
          REGISTRY="${GITHUB_SERVER_URL#*://}"
          IMAGE="$REGISTRY/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.meta.outputs.image }}:devel
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.commit }}
          build-args: |
            VERSION=devel
            BUILD_DATE=${{ steps.meta.outputs.date }}
            COMMIT_ID=${{ steps.meta.outputs.commit }}
